<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>fenbi fixture generic（未知 class，验证结构兜底识别）</title>
</head>
<body>
  <!-- class 名与粉笔任何一版都不同，仅保留"选项行"的通用结构：li > label > input + 文本 -->
  <div class="q-card">
    <div class="q-stem">以下说法正确的是？</div>
    <ul class="zzz-list">
      <li class="zzz-item">
        <label class="zzz-lbl"><input type="radio" name="q1" /><span class="zzz-badge">A</span><span class="zzz-txt">甲的选项内容</span></label>
      </li>
      <li class="zzz-item">
        <label class="zzz-lbl"><input type="radio" name="q1" /><span class="zzz-badge">B</span><span class="zzz-txt">乙的选项内容</span></label>
      </li>
      <li class="zzz-item">
        <label class="zzz-lbl"><input type="radio" name="q1" /><span class="zzz-badge">C</span><span class="zzz-txt">丙的选项内容</span></label>
      </li>
      <li class="zzz-item">
        <label class="zzz-lbl"><input type="radio" name="q1" /><span class="zzz-badge">D</span><span class="zzz-txt">丁的选项内容</span></label>
      </li>
    </ul>
  </div>
</body>
</html>
